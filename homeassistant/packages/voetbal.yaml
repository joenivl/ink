# Voetbalwedstrijden (KNVB/Sportlink) als kalender in HA, en dus op het Ink-scherm.
# Elk uur haalt dit het programma op en schrijft het naar /config/www/ink-voetbal.ics;
# de integratie Remote Calendar leest dat bestand als kalender. Zie de README,
# "Voetbalwedstrijden".
#
# Eenmalig: zet dit bestand in /config/packages/voetbal.yaml en pas hieronder
# --team aan (teamnaam zonder club, bijv. O9-2; meerdere teams: --team vaker).
# Het script zelf (homeassistant/voetbal.py) komt elke keer vers van GitHub, met
# het token uit /config/esphome/secrets.yaml, net als de blueprint.

shell_command:
  ink_voetbal: >-
    t=$(sed -n 's/^github_token: *//p' /config/esphome/secrets.yaml | tr -d "\"' ");
    d=/config/ink && mkdir -p $d /config/www;
    curl -fsSL -H "Authorization: Bearer $t" -H "Accept: application/vnd.github.raw+json"
    -o $d/voetbal.py.nieuw
    "https://api.github.com/repos/joenivl/Ink/contents/homeassistant/voetbal.py?ref=main"
    && mv $d/voetbal.py.nieuw $d/voetbal.py;
    python3 $d/voetbal.py --team O9-2 --uit /config/www/ink-voetbal.ics

automation:
  - id: ink_voetbal
    alias: Ink voetbal
    description: Haalt elk uur het wedstrijdprogramma op voor de kalender Voetbal.
    variables:
      # De Remote Calendar-kalender die /local/ink-voetbal.ics leest.
      kalender: calendar.voetbal
    triggers:
      - trigger: time_pattern
        minutes: 17
      - trigger: homeassistant
        event: start
    actions:
      - action: shell_command.ink_voetbal
        continue_on_error: true
        response_variable: uit
      - if:
          - condition: template
            value_template: "{{ uit is not defined or uit.returncode != 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: ink_voetbal
              title: Voetbal ophalen mislukt
              message: >-
                Het wedstrijdprogramma kon niet opgehaald worden; de kalender
                houdt de vorige versie. {{ uit.stderr if uit is defined else '' }}
          - stop: Ophalen mislukt
      - action: persistent_notification.dismiss
        data:
          notification_id: ink_voetbal
      # Remote Calendar haalt zelf maar af en toe op; zo staat het er meteen.
      - action: homeassistant.update_entity
        continue_on_error: true
        target:
          entity_id: "{{ kalender }}"
