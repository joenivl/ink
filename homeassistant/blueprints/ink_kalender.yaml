blueprint:
  name: Ink kalender
  description: >
    Stuurt agenda's en notities naar de Ink e-paper kalender (reTerminal E1003)
    en zet ingesproken zinnen om in een afspraak of notitie. Het scherm vraagt
    eerst om bevestiging; pas na 'Opslaan' komt het in de kalender of takenlijst.
    Notities die op het scherm worden aangetikt, worden afgevinkt (nog eens
    tikken zet ze terug). Een aangetikte afspraak toont de details.


    Vereist: de ESPHome-config esphome/ink-kalender.yaml (apparaatnaam
    'ink-kalender') en een AI-integratie met een AI-taak-entiteit.
  domain: automation
  source_url: https://github.com/joenivl/Ink/blob/main/homeassistant/blueprints/ink_kalender.yaml
  input:
    kalenders:
      name: Kalenders op het scherm
      description: Alle kalenders die op het scherm moeten komen.
      selector:
        entity:
          filter:
            - domain: calendar
          multiple: true
    doel_kalender:
      name: Kalender voor nieuwe afspraken
      description: Hier komen ingesproken afspraken in.
      selector:
        entity:
          filter:
            - domain: calendar
    notitielijsten:
      name: Takenlijsten voor 'Notities'
      description: >
        Open taken uit deze lijsten komen onder 'Notities'. Ingesproken notities
        komen in de eerste lijst. Mag leeg (dan geen notities).
      default: []
      selector:
        entity:
          filter:
            - domain: todo
          multiple: true
    weer_entiteit:
      name: Weersverwachting
      description: >
        Toont per dag een klein weericoon en de hoogste temperatuur in de
        weekweergave, bijv. van Buienradar of Met.no. Mag leeg (dan geen weer).
      default: ""
      selector:
        entity:
          filter:
            - domain: weather
    ai_taak:
      name: AI-taak
      description: >
        Zet de ingesproken tekst om in titel, datum en tijd. Bijvoorbeeld van
        de integratie OpenAI, Google Gemini, Anthropic of Ollama (lokaal).
      selector:
        entity:
          filter:
            - domain: ai_task
    kalendernaam_tonen:
      name: Kalendernaam voor de titel zetten
      description: 'Handig met een kalender per gezinslid, bijv. "Sanne: Pilates".'
      default: false
      selector:
        boolean:
    standaard_duur:
      name: Standaardduur zonder eindtijd
      default: 60
      selector:
        number:
          min: 15
          max: 480
          step: 15
          unit_of_measurement: min

mode: queued
max: 10

triggers:
  - trigger: time_pattern
    minutes: /5
    id: verstuur
  - trigger: homeassistant
    event: start
    id: verstuur
  - trigger: event
    event_type: esphome.ink_klaar
    id: verstuur
  - trigger: state
    entity_id: !input kalenders
    id: verstuur
  # Taak erbij of afgevinkt (de toestand = aantal open taken): meteen sturen.
  - trigger: state
    entity_id: !input notitielijsten
    id: verstuur
  # Lijsten van buiten HA (CalDAV, Todoist, ...) haalt HA zelf maar af en toe
  # op; elke minuut verversen, zodat een nieuwe taak snel op het scherm staat.
  - trigger: time_pattern
    minutes: /1
    id: lijsten
  - trigger: event
    event_type: esphome.ink_spraak
    id: spraak
  - trigger: event
    event_type: esphome.ink_opslaan
    id: opslaan
  - trigger: event
    event_type: esphome.ink_afvinken
    id: afvinken
  - trigger: event
    event_type: esphome.ink_details
    id: details

variables:
  kalenders: !input kalenders
  doel_kalender: !input doel_kalender
  notitielijsten: !input notitielijsten
  weer_entiteit: !input weer_entiteit
  ai_taak: !input ai_taak
  kalendernaam_tonen: !input kalendernaam_tonen
  standaard_duur: !input standaard_duur
  dagen: [maandag, dinsdag, woensdag, donderdag, vrijdag, zaterdag, zondag]

actions:
  # ------------------------------------------------ takenlijsten verversen
  # Verandert er iets, dan stuurt de state-trigger hierboven het scherm bij.
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'lijsten' }}"
    then:
      - if:
          - condition: template
            value_template: "{{ notitielijsten | count > 0 }}"
        then:
          - action: homeassistant.update_entity
            continue_on_error: true
            target:
              entity_id: "{{ notitielijsten }}"
      - stop: Lijsten ververst

  # ------------------------------------------------ ingesproken zin -> voorstel
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'spraak' }}"
    then:
      - variables:
          tekst: "{{ trigger.event.data.tekst | default('') | trim }}"
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Ink afspraak
          entity_id: "{{ ai_taak }}"
          instructions: |-
            Zet een ingesproken Nederlandse zin om in een afspraak voor de gezinskalender
            of in een notitie voor de takenlijst.
            Het is nu {{ dagen[now().weekday()] }} {{ now().strftime('%Y-%m-%d %H:%M') }}.
            De komende dagen:
            {%- for i in range(15) %}
            {%- set d = now() + timedelta(days=i) %}
            - {{ dagen[d.weekday()] }} {{ d.strftime('%Y-%m-%d') }}{{ ' (vandaag)' if i == 0 else ' (morgen)' if i == 1 else '' }}
            {%- endfor %}

            Soort:
            - "afspraak": iets op een bepaalde dag (verjaardag, training, tandarts, vakantie).
            - "notitie": iets om te onthouden of te doen zonder vaste dag (boodschap, klusje,
              "cadeautje kopen"), of als de zin begint met "notitie" of "zet op de lijst".
            - "geen": een vraag, een opdracht aan het huis of iets onverstaanbaars.

            Regels voor afspraken:
            - Een losse weekdag ("zaterdag") is de eerstvolgende; vandaag telt alleen als die tijd nog niet voorbij is.
            - "Volgende week <dag>" is die dag in de volgende kalenderweek (weken beginnen op maandag).
            - Tijden in 24-uursnotatie UU:MM. Kies bij "half drie" of "om acht" de logische tijd van de dag.
            - Geen tijd genoemd: begintijd en eindtijd leeg laten (hele dag).
            - Geen eindtijd genoemd: eindtijd leeg laten.
            - Titel: kort, met hoofdletter, zonder datum en tijd. Namen met hoofdletter.

            Bij een notitie: alleen de titel, kort, met hoofdletter, zonder het woord "notitie".

            Zin: "{{ tekst }}"
          structure:
            soort:
              description: afspraak, notitie of geen
              required: true
              selector:
                select:
                  options: [afspraak, notitie, geen]
            titel:
              description: Korte titel
              required: true
              selector:
                text:
            datum:
              description: Datum als JJJJ-MM-DD (alleen bij een afspraak)
              selector:
                text:
            begintijd:
              description: Begintijd als UU:MM, leeg voor de hele dag
              selector:
                text:
            eindtijd:
              description: Eindtijd als UU:MM, leeg als niet genoemd
              selector:
                text:
        response_variable: ai
      - variables:
          a: "{{ ai.data if ai is defined and ai.data is mapping else {} }}"
          soort: "{{ a.soort | default('geen') }}"
          titel: "{{ a.titel | default('') | string | trim }}"
          datum: "{{ a.datum | default('') | string | trim }}"
          datum_geldig: >-
            {{ datum is match('^\d{4}-\d{2}-\d{2}$')
               and strptime(datum, '%Y-%m-%d', none) is not none }}
          begin: >-
            {% set t = a.begintijd | default('') | string | trim %}
            {% if t is match('^\d{1,2}[:.]\d{2}$') %}
              {% set p = t.replace('.', ':').split(':') %}
              {{ '%02d:%02d' | format(p[0] | int, p[1] | int) }}
            {% endif %}
          eind: >-
            {% set t = a.eindtijd | default('') | string | trim %}
            {% if begin | trim == '' %}
            {% elif t is match('^\d{1,2}[:.]\d{2}$') %}
              {% set p = t.replace('.', ':').split(':') %}
              {{ '%02d:%02d' | format(p[0] | int, p[1] | int) }}
            {% else %}
              {{ (strptime(datum ~ ' ' ~ (begin | trim), '%Y-%m-%d %H:%M')
                  + timedelta(minutes=standaard_duur | int)).strftime('%H:%M') }}
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ ai is not defined }}"
        then:
          - action: esphome.ink_kalender_toon_melding
            continue_on_error: true
            data:
              tekst: De AI-taak werkte niet. Kijk in Home Assistant bij Instellingen > Systeem > Logboeken.
        else:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ soort == 'afspraak' and datum_geldig and titel != '' }}"
                sequence:
                  - action: esphome.ink_kalender_toon_voorstel
                    continue_on_error: true
                    data:
                      titel: "{{ titel }}"
                      datum: "{{ datum }}"
                      begin: "{{ begin | trim }}"
                      eind: "{{ eind | trim }}"
                      gehoord: "{{ tekst }}"
                      soort: afspraak
              - conditions:
                  - condition: template
                    value_template: "{{ soort == 'notitie' and titel != '' and notitielijsten | count > 0 }}"
                sequence:
                  - action: esphome.ink_kalender_toon_voorstel
                    continue_on_error: true
                    data:
                      titel: "{{ titel }}"
                      datum: ""
                      begin: ""
                      eind: ""
                      gehoord: "{{ tekst }}"
                      soort: notitie
              - conditions:
                  - condition: template
                    value_template: "{{ soort == 'notitie' and notitielijsten | count == 0 }}"
                sequence:
                  - action: esphome.ink_kalender_toon_melding
                    continue_on_error: true
                    data:
                      tekst: >-
                        Dat is een notitie, maar er is nog geen takenlijst gekozen in de
                        Ink-automatisering.
            default:
              - action: esphome.ink_kalender_toon_melding
                continue_on_error: true
                data:
                  tekst: Ik hoorde "{{ tekst }}", maar kon daar geen afspraak of notitie van maken.
      - stop: Spraak verwerkt

  # ------------------------------------------------ bevestigd -> kalender in
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'opslaan' }}"
    then:
      - variables:
          d: "{{ trigger.event.data }}"
      - if:
          - condition: template
            value_template: "{{ (d.soort | default('') or 'afspraak') == 'notitie' }}"
        then:
          - action: todo.add_item
            target:
              entity_id: "{{ notitielijsten[0] }}"
            data:
              item: "{{ d.titel }}"
      - if:
          - condition: template
            value_template: "{{ (d.soort | default('') or 'afspraak') == 'afspraak' and (d.begin | default('')) == '' }}"
        then:
          - action: calendar.create_event
            target:
              entity_id: "{{ doel_kalender }}"
            data:
              summary: "{{ d.titel }}"
              start_date: "{{ d.datum }}"
              end_date: "{{ (strptime(d.datum, '%Y-%m-%d') + timedelta(days=1)).strftime('%Y-%m-%d') }}"
      - if:
          - condition: template
            value_template: "{{ (d.soort | default('') or 'afspraak') == 'afspraak' and (d.begin | default('')) != '' }}"
        then:
          - action: calendar.create_event
            target:
              entity_id: "{{ doel_kalender }}"
            data:
              summary: "{{ d.titel }}"
              start_date_time: "{{ d.datum }} {{ d.begin }}:00"
              end_date_time: >-
                {% set s = strptime(d.datum ~ ' ' ~ d.begin, '%Y-%m-%d %H:%M') %}
                {% if (d.eind | default('')) != '' %}
                  {% set e = strptime(d.datum ~ ' ' ~ d.eind, '%Y-%m-%d %H:%M') %}
                  {% if e <= s %}{% set e = e + timedelta(days=1) %}{% endif %}
                {% else %}
                  {% set e = s + timedelta(minutes=standaard_duur | int) %}
                {% endif %}
                {{ e.strftime('%Y-%m-%d %H:%M:%S') }}

  # ------------------------------------------------ details van een aangetikte afspraak
  # Het scherm stuurt de dag en de id van de afspraak (zie afspraken_tekst).
  # Oudere firmware stuurt geen id: dan op begintijd ('-' = hele dag of een
  # vervolgdag) en titel zoeken.
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'details' }}"
    then:
      - variables:
          gevraagd: "{{ trigger.event.data }}"
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id: "{{ kalenders }}"
        data:
          start_date_time: "{{ gevraagd.datum }} 00:00:00"
          end_date_time: >-
            {{ (strptime(gevraagd.datum, '%Y-%m-%d') + timedelta(days=1)).strftime('%Y-%m-%d') }} 00:00:00
        response_variable: dag
      - variables:
          afspraak: >-
            {%- set ns = namespace(e=none) -%}
            {%- for kal, data in (dag | default({})).items() -%}
              {%- set naam = state_attr(kal, 'friendly_name') or kal -%}
              {%- for e in data.events if ns.e is none -%}
                {%- set titel = (e.summary | default('') | replace('\n', ' ') | trim) -%}
                {%- if kalendernaam_tonen -%}{%- set titel = naam ~ ': ' ~ titel -%}{%- endif -%}
                {%- set tijd = as_local(as_datetime(e.start)).strftime('%H:%M') if 'T' in e.start else '-' -%}
                {%- set id = ((kal ~ '|' ~ e.start ~ '|' ~ (e.summary | default(''))) | md5)[:12] -%}
                {%- if (gevraagd.id | default('')) != ''
                       and id == gevraagd.id
                       or (gevraagd.id | default('')) == ''
                       and titel == gevraagd.titel and (gevraagd.tijd == '-' or gevraagd.tijd == tijd) -%}
                  {%- set ns.e = dict(e, kalender=naam) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.e if ns.e is not none else {} }}
      - action: esphome.ink_kalender_toon_details
        continue_on_error: true
        data:
          gevonden: "{{ 'ja' if afspraak else 'nee' }}"
          titel: "{{ afspraak.summary | default('') }}"
          datum: >-
            {%- if not afspraak -%}
            {%- elif 'T' in afspraak.start -%}{{ as_local(as_datetime(afspraak.start)).strftime('%Y-%m-%d') }}
            {%- else -%}{{ afspraak.start }}{%- endif -%}
          begin: >-
            {{ as_local(as_datetime(afspraak.start)).strftime('%H:%M') if afspraak and 'T' in afspraak.start else '' }}
          # Hele dag: HA geeft de dag ná de laatste dag als einde.
          eind_datum: >-
            {%- if not afspraak or not afspraak.end -%}
            {%- elif 'T' in afspraak.end -%}{{ as_local(as_datetime(afspraak.end)).strftime('%Y-%m-%d') }}
            {%- else -%}{{ (strptime(afspraak.end, '%Y-%m-%d') - timedelta(days=1)).strftime('%Y-%m-%d') }}{%- endif -%}
          eind: >-
            {{ as_local(as_datetime(afspraak.end)).strftime('%H:%M') if afspraak and 'T' in (afspraak.end or '') else '' }}
          locatie: "{{ (afspraak.location | default('') or '') | replace('\n', ', ') | trim }}"
          # Zonder HTML (Google zet daar soms opmaak in), op één regel, hooguit 600 tekens.
          omschrijving: >-
            {{ ((afspraak.description | default('') or '') | regex_replace('<[^>]*>', ' ')
               | replace('&nbsp;', ' ') | replace('&amp;', '&') | regex_replace('\\s+', ' ') | trim)[:600] }}
          kalender: "{{ afspraak.kalender | default('') }}"
      - stop: Details verstuurd

  # ------------------------------------------------ notitie (terug)gezet op het scherm
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'afvinken' }}"
    then:
      - action: todo.update_item
        continue_on_error: true
        target:
          entity_id: "{{ trigger.event.data.lijst }}"
        data:
          item: "{{ trigger.event.data.uid }}"
          status: >-
            {{ 'needs_action' if trigger.event.data.klaar | default('ja') == 'nee' else 'completed' }}

  # ------------------------------------------------ agenda naar het scherm
  # Het scherm ververst alleen als er echt iets veranderd is.
  - variables:
      grid_start: >-
        {% set eerste = today_at().replace(day=1) %}
        {{ (eerste - timedelta(days=eerste.weekday())).strftime('%Y-%m-%d') }}
  - action: calendar.get_events
    target:
      entity_id: "{{ kalenders }}"
    data:
      start_date_time: "{{ grid_start }} 00:00:00"
      end_date_time: "{{ (strptime(grid_start, '%Y-%m-%d') + timedelta(days=42)).strftime('%Y-%m-%d') }} 00:00:00"
    response_variable: agenda
  - variables:
      # Per regel "JJJJ-MM-DD~id|UU:MM|titel"; id = vaste id van de afspraak
      # (md5 van kalender, start en titel; HA geeft zelf geen id). Hele-dag-afspraken krijgen '-' als
      # tijd en komen op elke dag die ze duren. Een afspraak met tijd over
      # meerdere dagen is op elke dag een (grijze) hele-dag-balk. Gesorteerd op
      # dag en tijd ('-' eerst), niet op de id. Alleen dagen in het rooster
      # (42 dagen vanaf grid_start) worden meegestuurd.
      afspraken_tekst: >-
        {%- set g0 = strptime(grid_start, '%Y-%m-%d').date() -%}
        {%- set ns = namespace(r=[]) -%}
        {%- for kal, data in agenda.items() -%}
          {%- set naam = state_attr(kal, 'friendly_name') or kal -%}
          {%- for e in data.events -%}
            {%- set titel = (e.summary | default('') | replace('\n', ' ') | trim) -%}
            {%- if kalendernaam_tonen -%}{%- set titel = naam ~ ': ' ~ titel -%}{%- endif -%}
            {%- set id = ((kal ~ '|' ~ e.start ~ '|' ~ (e.summary | default(''))) | md5)[:12] -%}
            {%- if 'T' in e.start -%}
              {%- set s = as_local(as_datetime(e.start)) -%}
              {%- set t = as_local(as_datetime(e.end | default(e.start))) -%}
              {%- set d0 = s.date() -%}
              {%- set n = [((t - timedelta(seconds=1)).date() - d0).days + 1, 1] | max -%}
              {#- Meerdere dagen: elke dag een grijze balk, zoals een hele-dag-afspraak -#}
              {%- set tijd = s.strftime('%H:%M') if n == 1 else '-' -%}
            {%- else -%}
              {%- set d0 = strptime(e.start, '%Y-%m-%d').date() -%}
              {%- set n = [(strptime(e.end, '%Y-%m-%d').date() - d0).days, 1] | max -%}
              {%- set tijd = '-' -%}
            {%- endif -%}
            {%- for i in range([(g0 - d0).days, 0] | max, [n, (g0 - d0).days + 42] | min) -%}
              {%- set dag = (d0 + timedelta(days=i)).strftime('%Y-%m-%d') -%}
              {%- set tijd_dag = tijd if i == 0 else '-' -%}
              {%- set ns.r = ns.r + [[dag ~ tijd_dag ~ titel, dag ~ '~' ~ id ~ '|' ~ tijd_dag ~ '|' ~ titel]] -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endfor -%}
        {#- Sorteren op dag en tijd (hele dag '-' eerst), niet op de id -#}
        {{- ns.r | sort(attribute='0') | map(attribute='1') | join('\n') -}}
      weer_tekst: ""
  # Per regel "JJJJ-MM-DD|toestand|max|min", van vandaag tot en met zondag.
  # Het scherm neemt dit maar een paar keer per dag over (weer_elke).
  - if:
      - condition: template
        value_template: "{{ weer_entiteit not in ['', none] }}"
    then:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: "{{ weer_entiteit }}"
        data:
          type: daily
        response_variable: verwachting
      - variables:
          weer_tekst: >-
            {%- set ns = namespace(r=[], dagen=[]) -%}
            {%- set van = now().strftime('%Y-%m-%d') -%}
            {%- set tot = (now() + timedelta(days=6 - now().weekday())).strftime('%Y-%m-%d') -%}
            {%- set lijst = verwachting[weer_entiteit].forecast | default([])
                 if verwachting is defined and weer_entiteit in verwachting else [] -%}
            {%- for f in lijst -%}
              {%- set d = as_local(as_datetime(f.datetime)).strftime('%Y-%m-%d') -%}
              {%- if van <= d <= tot and d not in ns.dagen -%}
                {%- set max = (f.temperature | round(0) | int) if f.temperature is number else '' -%}
                {%- set min = (f.templow | round(0) | int) if f.templow is number else '' -%}
                {%- set ns.dagen = ns.dagen + [d] -%}
                {%- set ns.r = ns.r + [d ~ '|' ~ (f.condition | default('')) ~ '|' ~ max ~ '|' ~ min] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.r | join('\n') -}}
  - if:
      - condition: template
        value_template: "{{ notitielijsten | count > 0 }}"
    then:
      - action: todo.get_items
        target:
          entity_id: "{{ notitielijsten }}"
        data:
          status: needs_action
        response_variable: taken
      - action: esphome.ink_kalender_toon_agenda
        continue_on_error: true
        data:
          afspraken: "{{ afspraken_tekst }}"
          weer: "{{ weer_tekst }}"
          notities: >-
            {%- set ns = namespace(r=[]) -%}
            {%- for lijst, data in taken.items() -%}
              {%- for t in data['items'] -%}
                {%- set ns.r = ns.r + [lijst ~ '|' ~ t.uid ~ '|' ~ (t.summary | replace('\n', ' ') | trim)] -%}
              {%- endfor -%}
            {%- endfor -%}
            {{- ns.r | join('\n') -}}
    else:
      - action: esphome.ink_kalender_toon_agenda
        continue_on_error: true
        data:
          afspraken: "{{ afspraken_tekst }}"
          weer: "{{ weer_tekst }}"
          notities: ""
